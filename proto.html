class name{

        this.name = name;

    }

        console.log(this.age);

}

const obj = new name("Gautam",22);
obj.getdetails();

const newobj ={
    name : "Priyanka",
    age : 22,

}
function myprotoname(name){
    this.name = name;
}
myprotoname.prototype = newobj;

const obj2 = new myprotoname("Gautam");
console.log(obj2);
console.log(obj2.getdetails());
